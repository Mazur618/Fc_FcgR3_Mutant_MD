name: Analysis tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -B -m unittest discover -s analysis_v2 -p 'test_*.py' -v
      - run: |
          for script in *.sh scripts/*.sh scripts/*.slurm legacy/*.sh; do
            bash -n "$script"
          done
